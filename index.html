<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d0d0d">
<meta name="robots" content="noindex,nofollow">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>טל ליפשטט · העסק</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Assistant:wght@400;500;600;700&display=swap">
<style>
/* Layout: same shell as the Playground finance app — dark rail on desktop, top bar + tile sheet on phones, one screen per #route.
   Palette: Tal's own — deep forest ink with warm sand, not Playground navy. */
:root{
  --bg:#f4f2ec;--surface:#fff;--surface2:#efece4;--ink:#18211c;--muted:#66706a;--line:#e0dcd2;
  --rail:#16231c;--rail2:#21352a;--rail-ink:#c9d6cd;--accent:#2e7a55;--accent-soft:#dfefe6;--sand:#c49a5a;--sand-soft:#f6ecdc;
  --ok:#2e7a55;--ok-soft:#dfefe6;--warn:#a2650b;--warn-soft:#fbefd9;--bad:#bb3b34;--bad-soft:#fbe3e1;--mute-soft:#ebe8e0;
  --font-d:"Rubik","Assistant",system-ui,sans-serif;--font-b:"Assistant","Rubik",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--surface:#161e1a;--surface2:#1c2621;--ink:#e8eee9;--muted:#9aa69f;--line:#2a3630;--rail:#0b110e;--rail2:#14201a;--rail-ink:#a9bbb0;--accent:#6cc497;--accent-soft:#1b3328;--sand:#d8b27a;--sand-soft:#33291b;--ok:#6cc497;--ok-soft:#1b3328;--warn:#eeb05a;--warn-soft:#3a2c15;--bad:#ff8a80;--bad-soft:#3d1f1d;--mute-soft:#202a25;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1512;--surface:#161e1a;--surface2:#1c2621;--ink:#e8eee9;--muted:#9aa69f;--line:#2a3630;--rail:#0b110e;--rail2:#14201a;--rail-ink:#a9bbb0;--accent:#6cc497;--accent-soft:#1b3328;--sand:#d8b27a;--sand-soft:#33291b;--ok:#6cc497;--ok-soft:#1b3328;--warn:#eeb05a;--warn-soft:#3a2c15;--bad:#ff8a80;--bad-soft:#3d1f1d;--mute-soft:#202a25;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;direction:rtl}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-d)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:linear-gradient(180deg,var(--rail),var(--rail2));color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}
.brand{font:700 18px var(--font-d);padding:0 10px 4px}
.brand small{display:block;font:500 12px var(--font-b);color:var(--sand)}
.nav{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.nav a{display:flex;align-items:center;gap:10px;color:var(--rail-ink);text-decoration:none;font:500 14.5px var(--font-d);padding:9px 10px;border-radius:9px}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a[aria-current="page"]{background:var(--sand-soft);color:var(--rail)}
.nav svg,.mgrid svg{stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav svg{width:18px;height:18px;flex:none}
.badge{margin-inline-start:auto;background:var(--bad);color:#fff;font:600 11px var(--font-d);border-radius:999px;padding:0 7px}
.rail .foot{margin-top:auto;font-size:12px;color:var(--rail-ink);padding:0 10px}
.rail .foot button{background:none;border:0;color:var(--rail-ink);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
.main{min-width:0;padding-block:20px 90px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));max-width:1180px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.top h1{font:700 clamp(21px,3vw,26px) var(--font-d);margin:0}
.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.months{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px;flex-wrap:wrap}
.months button{font:600 13px var(--font-d);border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:7px;cursor:pointer}
.months button[aria-pressed="true"]{background:var(--rail);color:#fff}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.card h2{font:600 16px var(--font-d);margin:0 0 2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card .cap{color:var(--muted);font-size:13px;margin:0 0 12px}
.kpi{display:flex;flex-direction:column;gap:2px}
.kpi .l{color:var(--muted);font-size:13px;font-weight:600}
.kpi .v{font:600 23px var(--font-d);font-variant-numeric:tabular-nums}
.kpi .h{color:var(--muted);font-size:12.5px}
.kpi.bad .v{color:var(--bad)}.kpi.ok .v{color:var(--ok)}.kpi.warn .v{color:var(--warn)}
.two{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
@media (max-width:980px){.two{grid-template-columns:minmax(0,1fr)}}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap}
.c-ok{background:var(--ok-soft);color:var(--ok)}.c-bad{background:var(--bad-soft);color:var(--bad)}.c-na{background:var(--mute-soft);color:var(--muted)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-sand{background:var(--sand-soft);color:var(--warn)}
.alerts{display:flex;flex-direction:column;gap:8px}
.alert{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;background:var(--surface2);font-size:14px}
.alert .dot{width:9px;height:9px;border-radius:50%}
.alert a{color:var(--accent);font-weight:600;text-decoration:none;font-size:13px;white-space:nowrap}
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.track{height:12px;background:var(--surface2);border-radius:6px;overflow:hidden;position:relative}
.fill{display:block;height:100%;background:var(--accent);border-radius:6px}
.fill.exp{background:var(--sand)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:right;font:600 12.5px var(--font-d);color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}tr.click:hover td{background:var(--surface2)}
tr.dim td{opacity:.5}
td .v{font-weight:600} td .d{color:var(--muted);font-size:12.5px;margin-top:1px}
td.amt{white-space:nowrap;text-align:left;font-family:var(--font-d);font-variant-numeric:tabular-nums;font-weight:600}
.amt.bad{color:var(--bad)}.amt.ok{color:var(--ok)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.btn{font:600 13px var(--font-b);border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:6px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.ghost{border-style:dashed;color:var(--accent);border-color:var(--accent);background:transparent}
.btn:disabled{opacity:.5;cursor:default}
input.f,select.f,textarea.f{font:14px var(--font-b);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0;width:100%}
select.s{font:13px var(--font-b);border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:3px 6px;max-width:170px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end;padding:12px;border:1px dashed var(--line);border-radius:10px;margin-bottom:12px;background:var(--surface2)}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);font-weight:600}
.drop{border:2px dashed var(--accent);border-radius:12px;padding:26px 16px;text-align:center;color:var(--muted);background:var(--accent-soft);cursor:pointer;margin-bottom:12px}
.drop b{color:var(--accent);font:600 16px var(--font-d);display:block;margin-bottom:4px}
.drop.over{background:var(--surface2)}
.lnk{color:var(--accent);text-decoration:none;font-weight:600;cursor:pointer;background:none;border:0;font:inherit;padding:0}
.sess{display:flex;gap:6px;flex-wrap:wrap}
.sess span{font-size:12.5px;border-radius:7px;padding:2px 8px;background:var(--surface2);border:1px solid var(--line);cursor:pointer}
.sess span.free{text-decoration:line-through;color:var(--muted)}
.sess span.plan{border-style:dashed}
.empty{padding:26px;text-align:center;color:var(--muted)}
.note{color:var(--muted);font-size:12.5px;margin-top:10px}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:14px;z-index:60}
.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 8px}
.sec h3{font:600 16px var(--font-d);margin:0}
.sec span{color:var(--muted);font-size:13px}
.fab{position:fixed;left:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:40;width:56px;height:56px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.imp td{vertical-align:middle}.imp select,.imp input{max-width:150px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);font:inherit;font-size:13px;background:#fff}.imp tr.dup{opacity:.45}
.pl{display:grid;grid-template-columns:76px 1fr;gap:14px 10px;align-items:start;font-size:13px}.pl .b{display:flex;flex-direction:column;gap:3px}.pl .r{height:9px;border-radius:5px;background:var(--ink)}.pl .r.x{background:var(--muted);opacity:.55}
.dlg{position:fixed;inset:0;z-index:50;background:rgba(10,16,13,.55);display:flex;align-items:flex-end;justify-content:center}
.dlg>div{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:761px){.dlg{align-items:center}.dlg>div{border-radius:16px}}
.dlg h2{font:700 19px var(--font-d);margin:0 0 2px}
.dlg .sub{color:var(--muted);font-size:13.5px;margin:0 0 12px}
.dlg .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,var(--rail),var(--rail2));padding:16px;z-index:70}
.gate[hidden]{display:none}
.gbox{background:var(--bg);border-radius:16px;padding:22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.glogo{font:700 21px var(--font-d)}.glogo small{display:block;font:500 13px var(--font-b);color:var(--warn)}
.gbox label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);font-weight:600}
.gerr{color:var(--bad);font-size:13px;min-height:1.2em;margin:0}
.mtop,.msheet{display:none}
#refBtn{position:fixed;left:18px;bottom:18px;z-index:60;display:inline-flex;align-items:center;gap:7px;font:600 14px var(--font-d);color:#fff;background:var(--navy,#1F3364);border:0;border-radius:999px;padding:10px 16px;box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer}#refBtn:disabled{opacity:.6;cursor:default}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding-bottom:40px}
  .mtop{display:flex;position:sticky;top:0;z-index:30;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(180deg,var(--rail),var(--rail2));color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
  .mtop b{font:700 17px var(--font-d)}
  .mbtn{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--font-d);color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:8px 13px;cursor:pointer}
  .mbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  .msheet{display:block;position:fixed;inset:0;z-index:45;background:rgba(10,16,13,.55)}
  .msheet[hidden]{display:none}
  .mpanel{position:absolute;inset:auto 0 0 0;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font:700 16px var(--font-d)}
  .mx{background:none;border:0;color:var(--muted);font:600 14px var(--font-b);cursor:pointer;padding:6px}
  .mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .mgrid a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:92px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;font:600 13.5px var(--font-d);text-align:center;padding:10px 6px}
  .mgrid a[aria-current="page"]{background:var(--rail);border-color:var(--rail);color:#fff}
  .mgrid svg{width:26px;height:26px}
  .mgrid .badge{position:absolute;top:7px;left:7px}
  .kpi .v{white-space:nowrap;font-size:clamp(17px,5.2vw,23px)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hide-m{display:none}
}
@media(max-width:760px){#tForm{grid-template-columns:1fr 1fr!important}#tForm label:first-child{grid-column:1/-1}}

/* ---- monochrome theme: black & white only ---- */
:root:root:root{--bg:#f7f7f7;--surface:#fff;--surface2:#f2f2f2;--ink:#111;--muted:#707070;--line:#e3e3e3;
  --rail:#0b0b0b;--rail2:#0b0b0b;--rail-ink:#a8a8a8;--accent:#111;--accent-soft:#f2f2f2;--sand:#8c8c8c;--sand-soft:#fff;
  --ok:#111;--ok-soft:#efefef;--warn:#111;--warn-soft:#fff;--bad:#111;--bad-soft:#111;--mute-soft:#f2f2f2;color-scheme:light}
body{letter-spacing:.1px}
.rail{background:#0b0b0b;border-inline-end:1px solid #000}
.brand{font:700 19px var(--font-d);letter-spacing:.2px}
.nav a{border-radius:8px}
.nav a[aria-current="page"]{background:#fff;color:#0b0b0b}
.badge{background:#fff;color:#0b0b0b}
.nav a[aria-current="page"] .badge{background:#0b0b0b;color:#fff}
.card,.tbl{border-radius:14px;border-color:#e6e6e6;box-shadow:0 1px 0 rgba(0,0,0,.02)}
.kpi .l{text-transform:none;letter-spacing:.2px}
.kpi .v{font-weight:700;letter-spacing:-.3px}
.kpi.bad .v,.kpi.warn .v,.kpi.ok .v{color:#111}
.kpi.bad .v::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#111;margin-inline-start:8px;vertical-align:middle}
.kpi.warn .v::after{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;border:1.5px solid #111;margin-inline-start:8px;vertical-align:middle}
.amt.bad,.amt.ok{color:#111}
.chip{border:1px solid transparent}
.c-bad{background:#111;color:#fff}
.c-warn{background:#fff;color:#111;border-color:#111}
.c-ok{background:#efefef;color:#111}
.c-na{background:transparent;color:#707070;border-color:#e0e0e0}
.c-sand,.c-acc{background:#f2f2f2;color:#111}
th{background:#fafafa;letter-spacing:.2px}
.btn{border-color:#dcdcdc}
.btn.pri,.btn[aria-pressed="true"]{background:#111;border-color:#111;color:#fff}
.btn.ghost{color:#111;border-color:#111}
.drop{border-color:#bdbdbd;background:#fafafa}.drop b{color:#111}
.lnk,.alert a{color:#111;text-decoration:underline}
.fill{background:#111}.fill.exp{background:#9a9a9a}
.sess span{background:#fff}
.sess span.plan{border-style:dashed}
.sec h3[style]{color:#111!important}
.home-hello{font:700 clamp(24px,3.4vw,30px) var(--font-d);margin:0;letter-spacing:-.4px}
.list{display:flex;flex-direction:column}
.list .it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.list .it:last-child{border-bottom:0}
.list .it .t{color:var(--muted);font-variant-numeric:tabular-nums;font-family:var(--font-d);min-width:46px}
.todo{display:flex;flex-direction:column;gap:8px}
.todo a{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;color:#111;text-decoration:none;font-size:14px;background:#fff}
.todo a b{font:700 18px var(--font-d)}
.todo a:hover{border-color:#111}
.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:980px){.three{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="app">
<button id="refBtn" type="button" onclick="refreshAll(this)">⟳ רענון</button>
<header class="mtop"><b id="mTitle">העסק</b><button class="mbtn" id="mMenu" type="button" aria-haspopup="dialog"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>תפריט</button></header>
<aside class="rail">
  <div class="brand">טל ליפשטט<small>העסק האישי</small></div>
  <nav class="nav" id="nav"></nav>
  <div class="foot"><button id="syncBtn" type="button">סנכרון יומן</button> · <button id="outBtn" type="button">יציאה</button></div>
</aside>
<main class="main" id="main"><div class="empty">טוען…</div></main>
</div>
<div class="msheet" id="msheet" hidden><div class="mpanel" role="dialog" aria-label="תפריט"><div class="mhead"><span>לאן הולכים?</span><button class="mx" id="mClose" type="button">סגירה</button></div><div class="mgrid" id="mgrid"></div></div></div>
<button class="fab" id="fab" type="button" aria-label="הוצאה מהירה" hidden>+</button>
<input type="file" id="fileIn" accept="application/pdf,image/*,.csv,.xlsx,.xls" multiple hidden>
<div id="gate" class="gate" hidden>
  <form class="gbox" id="gForm" autocomplete="on">
    <div class="glogo">טל ליפשטט<small>העסק האישי</small></div>
    <label>מייל<input class="f" id="gEm" type="email" autocomplete="username" value="lipshtat1@gmail.com" required></label>
    <label>סיסמה<input class="f" id="gPw" type="password" autocomplete="current-password" required></label>
    <button class="btn pri" type="submit">כניסה</button>
    <button class="btn ghost" id="gForgot" type="button">שכחתי סיסמה</button>
    <p class="gerr" id="gErr" role="alert"></p>
  </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js" defer></script>
<script>
const SB=supabase.createClient('https://afruoruaconlwewoerql.supabase.co','sb_publishable__oT9-XWFM9cMmfGPqTp59g_364SQXr4',{auth:{storageKey:'tal-biz-auth',persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  <div class="card"><h2>לא שובצו</h2><p class="cap">פעילים בלי אימון ביומן בשבוע הזה</p><div class="sess">${not.map(c=>`<span data-act="client" data-id="${c.id}">${esc(c.name)}</span>`).join('')||'<span>כולם משובצים ✓</span>'}</div></div></div>

function splitDlg(p){

const TAXCAT='מיסים';
const VATR=0.18,inVat=a=>+a*VATR/(1+VATR),NOVAT=['פנסיה','עמלות בנק','ביטוח','מיסים','שכר דירה','ארנונה ומים'],CARCAT='רכב: דלק וחניה';
/* VAT for one bi-month: on what came in (reportable income) minus VAT on business expenses that have an invoice */
function vatOf(k){const D=acctData(k),out=D.inc.reduce((t,p)=>t+inVat(p.amount),0);
  const inp=D.biz.filter(x=>x.invoice==='received'&&!NOVAT.includes(x.category)).reduce((t,x)=>t+inVat(x.amount)*(x.category===CARCAT?2/3:1),0);
  const noInv=D.biz.filter(x=>x.invoice==='missing'&&!NOVAT.includes(x.category)),lost=noInv.reduce((t,x)=>t+inVat(x.amount)*(x.category===CARCAT?2/3:1),0);
  return {out,inp,due:out-inp,lost,noInv:noInv.length,incSum:D.inc.reduce((t,p)=>t+ +p.amount,0)}}
function vatCard(k){const V=vatOf(k);return `<div class="card"><h2>מע״מ לתקופה</h2><p class="cap">הערכה לפי מה שנכנס בבנק, בפייבוקס ואצל שי · אבירם מאשר את המספר הסופי</p>
  <div class="alerts"><div class="alert"><span>מע״מ על ההכנסות (מתוך ${ils(V.incSum)})</span><b class="num" style="margin-inline-start:auto">${ils(V.out)}</b></div>
  <div class="alert"><span>פחות מע״מ על הוצאות עסקיות עם חשבונית</span><b class="num" style="margin-inline-start:auto">−${ils(V.inp)}</b></div>
  <div class="alert" style="font-weight:700"><span>צפוי לתשלום למע״מ</span><b class="num" style="margin-inline-start:auto">${ils(V.due)}</b></div></div>
  ${V.lost>=1?`<p class="note">💡 ל-${V.noInv} הוצאות עסקיות חסרה חשבונית. עם חשבונית היית מקזז עוד בערך ${ils(V.lost)} מע״מ.</p>`:''}
  <p class="note d">רכב: מקוזז 2/3 מהמע״מ. שכירות, ביטוח, פנסיה ועמלות — בלי מע״מ.</p></div>`}
const bizCats=()=>S.settings?.biz_cats||[];

function acctData(k){
  const m0=+k.split('-')[1]*2,y=k.split('-')[0],ms=[0,1].map(i=>y+'-'+String(m0+i+1).padStart(2,'0'));
  const inc=S.payments.filter(p=>['mercantile','paybox','shay'].includes(p.source)&&!NOTBIZ.includes(p.category)&&biKey(p.paid_at)===k);

  return {ms,inc,biz:exps.filter(x=>isBiz(x)&&x.category!==TAXCAT),tax:exps.filter(x=>x.category===TAXCAT),priv:exps.filter(x=>!isBiz(x)&&x.category!==TAXCAT),greece:S.expenses.filter(x=>biKey(x.spent_at)===k&&x.category===GREECE)};
}

const dOnly=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
function taskGroups(){
  const today=dOnly(now),wkEnd=new Date(today);wkEnd.setDate(wkEnd.getDate()+(6-today.getDay()));
  const open=S.tasks.filter(t=>t.status!=='done'&&!t.done);

  open.forEach(t=>{if(!t.due)g.nodate.push(t);else{const d=dOnly(t.due);if(d<today)g.late.push(t);else if(+d===+today)g.today.push(t);else if(d<=wkEnd)g.week.push(t);else g.later.push(t)}});
  const pr={high:0,normal:1,low:2},srt=l=>l.sort((a,b)=>(pr[a.priority||'normal']-pr[b.priority||'normal'])||((a.due||'9')<(b.due||'9')?-1:1));
  Object.values(g).forEach(srt);return {g,open};
}

$('#gForm').onsubmit=async e=>{e.preventDefault();$('#gErr').textContent='';const {error}=await SB.auth.signInWithPassword({email:$('#gEm').value.trim(),password:$('#gPw').value});if(error)return $('#gErr').textContent=error.message==='Invalid login credentials'?'מייל או סיסמה שגויים':error.message;enter()};
$('#gForgot').onclick=async()=>{const email=$('#gEm').value.trim();if(!email)return;await SB.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});$('#gErr').textContent='נשלח מייל לאיפוס סיסמה'};
SB.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){const w=dlg(`<h2>סיסמה חדשה</h2><input class="f" id="np" type="password" autocomplete="new-password" placeholder="לפחות 8 תווים"><div class="row"><button class="btn pri" data-x="s">שמירה</button></div>`);w.querySelector('[data-x=s]').onclick=async()=>{const v=w.querySelector('#np').value;if(v.length<8)return toast('לפחות 8 תווים');const {error}=await SB.auth.updateUser({password:v});if(error)return toast(error.message);w.remove();toast('הסיסמה עודכנה')}}});
SB.auth.getSession().then(({data})=>{if(data.session)enter();else $('#gate').hidden=false});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
