<style>
/* Layout: same shell as the Playground finance app — dark rail on desktop, top bar + tile sheet on phones, one screen per #route.

:root{
  --bg:#f4f2ec;--surface:#fff;--surface2:#efece4;--ink:#18211c;--muted:#66706a;--line:#e0dcd2;

  --font-d:"Rubik","Assistant",system-ui,sans-serif;--font-b:"Assistant","Rubik",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--surface:#161e1a;--surface2:#1c2621;--ink:#e8eee9;--muted:#9aa69f;--line:#2a3630;--rail:#0b110e;--rail2:#14201a;--rail-ink:#a9bbb0;--accent:#6cc497;--accent-soft:#1b3328;--sand:#d8b27a;--sand-soft:#33291b;--ok:#6cc497;--ok-soft:#1b3328;--warn:#eeb05a;--warn-soft:#3a2c15;--bad:#ff8a80;--bad-soft:#3d1f1d;--mute-soft:#202a25;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1512;--surface:#161e1a;--surface2:#1c2621;--ink:#e8eee9;--muted:#9aa69f;--line:#2a3630;--rail:#0b110e;--rail2:#14201a;--rail-ink:#a9bbb0;--accent:#6cc497;--accent-soft:#1b3328;--sand:#d8b27a;--sand-soft:#33291b;--ok:#6cc497;--ok-soft:#1b3328;--warn:#eeb05a;--warn-soft:#3a2c15;--bad:#ff8a80;--bad-soft:#3d1f1d;--mute-soft:#202a25;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;direction:rtl}
.num{font-variant-numeric:tabular-nums;font-family:var(--font-d)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{background:linear-gradient(180deg,var(--rail),var(--rail2));color:#fff;padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}

.nav{display:flex;flex-direction:column;gap:2px;margin-top:14px}
.nav a{display:flex;align-items:center;gap:10px;color:var(--rail-ink);text-decoration:none;font:500 14.5px var(--font-d);padding:9px 10px;border-radius:9px}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav a[aria-current="page"]{background:var(--sand-soft);color:var(--rail)}

.nav svg{width:18px;height:18px;flex:none}

.rail .foot{margin-top:auto;font-size:12px;color:var(--rail-ink);padding:0 10px}

.main{min-width:0;padding-block:20px 90px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));max-width:1180px}

.sess{display:flex;gap:6px;flex-wrap:wrap}

.sec{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:22px 2px 8px}

.dlg{position:fixed;inset:0;z-index:50;background:rgba(10,16,13,.55);display:flex;align-items:flex-end;justify-content:center}

.dlg .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

.gbox{background:var(--bg);border-radius:16px;padding:22px;width:100%;max-width:360px;display:flex;flex-direction:column;gap:10px}
.glogo{font:700 21px var(--font-d)}.glogo small{display:block;font:500 13px var(--font-b);color:var(--warn)}
.gbox label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--muted);font-weight:600}
.gerr{color:var(--bad);font-size:13px;min-height:1.2em;margin:0}
.mtop,.msheet{display:none}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .main{padding-bottom:40px}
  .mtop{display:flex;position:sticky;top:0;z-index:30;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(180deg,var(--rail),var(--rail2));color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px}
  .mtop b{font:700 17px var(--font-d)}
  .mbtn{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--font-d);color:#fff;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.28);border-radius:10px;padding:8px 13px;cursor:pointer}
  .mbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
  .msheet{display:block;position:fixed;inset:0;z-index:45;background:rgba(10,16,13,.55)}
  .msheet[hidden]{display:none}
  .mpanel{position:absolute;inset:auto 0 0 0;background:var(--bg);border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .mhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;font:700 16px var(--font-d)}
  .mx{background:none;border:0;color:var(--muted);font:600 14px var(--font-b);cursor:pointer;padding:6px}
  .mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .mgrid a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:92px;background:var(--surface);border:1px solid var(--line);border-radius:14px;color:var(--ink);text-decoration:none;font:600 13.5px var(--font-d);text-align:center;padding:10px 6px}
  .mgrid a[aria-current="page"]{background:var(--rail);border-color:var(--rail);color:#fff}
  .mgrid svg{width:26px;height:26px}
  .mgrid .badge{position:absolute;top:7px;left:7px}
  .kpi .v{white-space:nowrap;font-size:clamp(17px,5.2vw,23px)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hide-m{display:none}
}
</style>

const SB=supabase.createClient('https://afruoruaconlwewoerql.supabase.co','sb_publishable__oT9-XWFM9cMmfGPqTp59g_364SQXr4',{auth:{storageKey:'tal-biz-auth',persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];

const RULE={monthly:'סוף חודש',package:'חבילה',per_session:'כל אימון',weekly:'כל שבוע',one_time:'חד פעמי'};
const METHOD={transfer:'העברה',paybox:'פייבוקס',cash:'מזומן',bit:'ביט',other:'לא ידוע'};
const INV={none:['לא הוחלט','c-na'],queued:['להפקה','c-warn'],issued:['חשבונית יצאה','c-ok'],not_needed:['לא מפיקים','c-na']};

 overview:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/>',

};

/* ---------- data ---------- */
async function all(mk){const out=[];for(let i=0;;i+=1000){const {data,error}=await mk().range(i,i+999);if(error)throw error;out.push(...data);if(data.length<1000)return out}}
async function load(){
  const q=t=>SB.from(t).select('*');
  S.months=await all(()=>q('client_months').order('month'));
  const [c,s,p,x,d,e,t]=await Promise.all([all(()=>q('clients').order('name')),all(()=>q('sessions').order('start_at').order('id')),all(()=>q('payments').order('paid_at',{ascending:false}).order('id')),all(()=>q('expenses').order('spent_at',{ascending:false}).order('id')),all(()=>q('docs').order('created_at',{ascending:false})),all(()=>q('calendar_events').eq('matched',false).eq('ignored',false).order('start_at')),all(()=>q('tasks').order('done').order('due',{nullsFirst:false}))]);
  Object.assign(S,{clients:c,sessions:s,payments:p,expenses:x,docs:d,events:e,tasks:t});

const mKey=d=>{d=new Date(d);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')};
const mLabel=k=>{const [y,m]=k.split('-');return HM[+m-1]+(+y!==now.getFullYear()?' '+y:'')};
const fmtD=iso=>{const d=new Date(iso);return d.getDate()+'.'+(d.getMonth()+1)};
const fmtT=iso=>new Date(iso).toLocaleTimeString('he-IL',{hour:'2-digit',minute:'2-digit'});
const monthStart=(d=now)=>new Date(d.getFullYear(),d.getMonth(),1);
const nextMonthStart=(d=now)=>new Date(d.getFullYear(),d.getMonth()+1,1);
const weekStart=(d=now)=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-x.getDay());return x};
const PERIODS=(()=>{const out=[];let d=new Date(FROM);while(d<=now){out.push(mKey(d));d=new Date(d.getFullYear(),d.getMonth()+1,1)}return out})();

/* ---------- the payment rules (as Tal defined them) ----------
   monthly     – a month is billed on the 1st of the next month; until then it is "accruing"
   per_session – due on the day of the session          one_time – same
   weekly      – due at the end of the week
   package     – paid up front; when 1 session is left the next package shows as upcoming
   Pairs are billed per person; a payer (e.g. Dikla for Shaked) carries the members' sessions. */
function clientDue(c){
  const ss=S.sessions.filter(s=>s.client_id===c.id&&charged(s)&&new Date(s.start_at)>=FROM);
  const sum=a=>a.reduce((t,s)=>t+(+s.price||0),0);
  const past=ss.filter(s=>new Date(s.start_at)<=now);
  const nm=nextMonthStart();
  const r={due:0,expect:0,why:'',left:null};
  if(c.billing==='monthly'){const ms=monthStart();r.due=sum(ss.filter(s=>new Date(s.start_at)<ms));r.expect=sum(ss.filter(s=>new Date(s.start_at)>=ms&&new Date(s.start_at)<nm));r.why='מצטבר '+HM[now.getMonth()]+' · נשלח ב-1 לחודש';}
  else if(c.billing==='weekly'){const ws=weekStart();r.due=sum(ss.filter(s=>new Date(s.start_at)<ws));r.expect=sum(ss.filter(s=>{const d=new Date(s.start_at);return d>=ws&&d<nm}));r.why='השבוע הנוכחי';}
  else if(c.billing==='package'&&c.package_size){
    const n=past.length,size=c.package_size,first=ss[0],k=+((first?.title||'').match(/(\d+)\s*$/)||[])[1]||1;
    const covered=k>1?size-k+1:0; // a package already running on 1.9 was paid before
    const pk=Math.ceil(Math.max(0,n-covered)/size);
    r.due=pk*size*(+c.price||0);
    const left=covered+pk*size-n;r.left=left;
    if(left<=1){r.expect=size*(+c.price||0);r.why=left===0?'החבילה נגמרה · חידוש':'נשאר אימון 1 בחבילה · חידוש';}
  } else {r.due=sum(past);r.expect=sum(ss.filter(s=>new Date(s.start_at)>now&&new Date(s.start_at)<nm));r.why='אימונים מתוכננים עד סוף החודש';}
  return r;
}
function payers(){
  const map={};
  for(const c of S.clients){const pid=payerId(c);const p=cById(pid);if(!p)continue;const row=map[pid]||(map[pid]={payer:p,due:0,expect:0,why:new Set(),left:null,paid:0});
    const d=clientDue(c);row.due+=d.due;row.expect+=d.expect;if(d.expect&&d.why)row.why.add(d.why);if(d.left!=null)row.left=d.left;}
  for(const p of S.payments){if(!p.client_id||new Date(p.paid_at)<new Date('2026-09-01'))continue;const c=cById(p.client_id);const row=map[payerId(c)];if(row)row.paid+=+p.amount}
  return Object.values(map).map(r=>{const open=r.due-r.paid;const credit=Math.max(0,-open);return {...r,open:Math.max(0,open),credit,expectNet:Math.max(0,r.expect-credit)}});
}

/* what happened until today and is not paid yet — per payer, simple: sessions done minus payments received */
function tillToday(){
  const rows={};
  for(const s of S.sessions){if(!charged(s)||new Date(s.start_at)>now||new Date(s.start_at)<FROM)continue;const c=cById(s.client_id);if(!c)continue;const pid=payerId(c);
    const r=rows[pid]||(rows[pid]={payer:cById(pid),sessions:[],due:0,paid:0});r.sessions.push(s);r.due+=+s.price||0;}
  for(const p of S.payments){if(!p.client_id||p.category!=='trainee'||p.for_period==='before')continue;const c=cById(p.client_id);const pid=payerId(c);const r=rows[pid];if(r)r.paid+=+p.amount}
  return Object.values(rows).map(r=>{r.open=Math.max(0,r.due-r.paid);
    // which sessions are still unpaid: the latest ones that add up to the open amount
    let left=r.open;r.unpaid=[];for(const s of [...r.sessions].sort((a,b)=>a.start_at<b.start_at?1:-1)){if(left<=0)break;r.unpaid.unshift(s);left-=+s.price||0}
    return r}).filter(r=>r.open>0).sort((a,b)=>b.open-a.open);
}

  const L=tillToday(),tot=L.reduce((a,r)=>a+r.open,0);
  const notYet=L.filter(r=>r.payer.not_yet_at),todo=L.filter(r=>!r.payer.not_yet_at);
  const paidM=S.payments.filter(p=>mKey(p.paid_at)===period&&p.client_id&&p.category==='trainee');
  const row=r=>`<tr class="click" data-client="${r.payer.id}"><td><div class="v">${esc(r.payer.name)}</div><div class="d"><span class="chip c-na">${esc(termsOf(r.payer))}</span></div><div class="d">${r.unpaid.map(s=>fmtD(s.start_at)+(s.client_id!==r.payer.id?' ('+esc(cById(s.client_id).name.split(' ')[0])+')':'')).join(' · ')}</div></td><td class="num hide-m">${r.unpaid.length}</td><td class="amt bad">${ils(r.open)}</td><td style="white-space:nowrap"><button class="btn sm pri" data-act="paid" data-id="${r.payer.id}">שולם</button> ${r.payer.not_yet_at?`<span class="chip c-warn">עוד לא · ${fmtD(r.payer.not_yet_at)}</span> <button class="btn sm" data-act="clearNotYet" data-id="${r.payer.id}">↺</button>`:`<button class="btn sm" data-act="notYet" data-id="${r.payer.id}">עוד לא</button>`} <button class="btn sm" data-act="bill" data-id="${r.payer.id}">הודעה</button></td></tr>`;
  const tbl=(list,empty)=>`<div class="tbl"><table><thead><tr><th>מי</th><th class="hide-m">אימונים</th><th>סכום</th><th></th></tr></thead><tbody>${list.map(row).join('')||`<tr><td colspan="4" class="empty">${empty}</td></tr>`}</tbody></table></div>`;
  return head('גבייה',`לפי התנאים של כל מתאמן · אימונים שהיו עד היום (${fmtD(now)}) ועוד לא שולמו`,`<button class="btn pri" data-act="newPay">+ תשלום שהתקבל</button>`)+

  <div class="sec"><h3>לבדוק</h3><span>לסמן שולם או עוד לא</span></div>${tbl(todo,'הכול מסומן ✓')}
  ${notYet.length?`<div class="sec"><h3>עוד לא שילמו</h3><span>סימנת "עוד לא"</span></div>${tbl(notYet,'')}`:''}

function acct(){
  const pays=S.payments.filter(p=>mKey(p.paid_at)===period),exps=S.expenses.filter(x=>mKey(x.spent_at)===period),dd=S.docs.filter(d=>d.month===period);
  const inc=pays.reduce((a,p)=>a+ +p.amount,0),ex=exps.reduce((a,x)=>a+ +x.amount,0);
  const checks=[[pays.every(p=>p.invoice_status==='issued')&&pays.length>0,'לכל תשלום יצאה חשבונית'],[exps.every(x=>x.invoice!=='missing'),'לכל הוצאה יש חשבונית'],[dd.some(d=>d.kind==='bank'),'דף בנק מרכנתיל הועלה'],[dd.some(d=>d.kind==='paybox'),'דוח פייבוקס הועלה'],[dd.length>0&&dd.every(d=>d.sent_to_accountant),'הכול נשלח לאבירם']];
  const done=checks.filter(c=>c[0]).length;
  return head('לרו״ח',`סגירת ${mLabel(period)} לאבירם · לתשלומים למוסדות`,monthSwitch())+
  `<div class="grid kpis">${kpi('הכנסות',ils(inc),pays.length+' תשלומים','ok')}${kpi('הוצאות',ils(ex),exps.length+' הוצאות')}${kpi('רווח לפני מס',ils(inc-ex),'')}${kpi('מסמכים',dd.length,'')}</div>
  <div class="grid two" style="margin-top:14px"><div class="card"><h2>צ׳קליסט לסגירת חודש</h2><p class="cap">${done} מתוך ${checks.length}</p><div class="alerts">${checks.map(([ok,t])=>`<div class="alert"><span class="dot" style="background:${ok?'var(--ok)':'var(--bad)'}"></span><span>${t}</span><span class="chip ${ok?'c-ok':'c-bad'}">${ok?'✓':'חסר'}</span></div>`).join('')}</div></div>
  <div class="card"><h2>שליחה לאבירם</h2><p class="cap">קובץ אחד עם כל ההכנסות וההוצאות של החודש, ואחר כך סימון שהמסמכים נשלחו</p><div class="tools"><button class="btn pri" data-act="csv">הורדת דוח החודש</button><button class="btn" data-act="sent">סימון: הכול נשלח</button></div><p class="note">את המסמכים עצמם מעלים במסך "מסמכים".</p></div></div>`;
}

  w.querySelector('[data-x=ign]').onclick=async()=>{await db(SB.from('calendar_events').update({ignored:true}).eq('event_id',e.event_id),'סומן');w.remove();reload()};
  w.querySelector('[data-x=save]').onclick=async()=>{const cid=val(w,'#cl');if(!cid)return;const c=cById(cid);
    await db(SB.from('sessions').insert({client_id:cid,event_id:e.event_id,start_at:e.start_at,title:e.title,price:val(w,'#pr')===''?(c.price||0):+val(w,'#pr'),status:new Date(e.start_at)<now?'done':'scheduled'}));
    await db(SB.from('calendar_events').update({matched:true}).eq('event_id',e.event_id));
    if(w.querySelector('#rem').checked){const t=e.title.replace(/\s*\d+$/,'').trim();await db(SB.from('clients').update({calendar_aliases:[...new Set([...(c.calendar_aliases||[]),t])]}).eq('id',cid))}
    toast('שויך');w.remove();reload()};
}
async function upload(files,link={}){
  for(const f of files){const month=link.month||period;const path=`${month}/${Date.now()}-${f.name.replace(/[^\w.\-א-ת ]/g,'_')}`;
    const {error}=await SB.storage.from('docs').upload(path,f,{contentType:f.type||'application/octet-stream'});if(error){toast('ההעלאה נכשלה: '+error.message);continue}
    const kind=link.kind||(/בנק|bank|מרכנתיל/i.test(f.name)?'bank':/paybox|פייבוקס/i.test(f.name)?'paybox':'other');
    await db(SB.from('docs').insert({path,name:f.name,kind,month,payment_id:link.payment_id||null,expense_id:link.expense_id||null}));}
  toast('הועלה');if(!link.payment_id&&!link.expense_id)reload();
}
window.addEventListener('message',async e=>{if(e.source!==window||e.data?.type!=='TB_ISSUED')return;const r=e.data;
  try{await db(SB.from('payments').update({invoice_status:'issued',invoice_number:String(r.number),invoice_date:r.date,service:svcOf(S.payments.find(x=>x.id===r.pid)||{})}).eq('id',r.pid),'חשבונית '+r.number+' נרשמה');
  const p=S.payments.find(x=>x.id===r.pid);if(r.wbName&&p?.client_id)await SB.from('clients').update({wb_name:r.wbName}).eq('id',p.client_id);
  window.postMessage({type:'TB_ACK',pid:r.pid},'*');if(S.clients.length)reload()}catch(err){}});
async function openDoc(id){const d=S.docs.find(x=>x.id===id);const w=window.open('','_blank');const {data,error}=await SB.storage.from('docs').createSignedUrl(d.path,600);if(error||!data){w&&w.close();return toast('לא הצלחתי לפתוח')}if(w)w.location=data.signedUrl;else location.href=data.signedUrl}
const ACT={
  newPay:()=>payDlg(null),paid:async id=>{const r=tillToday().find(x=>x.payer.id===id);if(cById(id).not_yet_at)await SB.from('clients').update({not_yet_at:null}).eq('id',id);payDlg(null,id,r?.open)},
  notYet:async id=>{await db(SB.from('clients').update({not_yet_at:new Date().toISOString().slice(0,10)}).eq('id',id),'סומן: עוד לא');reload()},
  clearNotYet:async id=>{await db(SB.from('clients').update({not_yet_at:null}).eq('id',id));reload()},editPay:id=>payDlg(S.payments.find(p=>p.id===id)),doc:id=>openDoc(id),split:id=>splitDlg(S.payments.find(p=>p.id===id)),issue:async id=>{const p=S.payments.find(x=>x.id===id),c=cById(p.client_id);
    if(document.documentElement.dataset.tbExt)window.postMessage({type:'TB_ISSUE',job:{pid:p.id,name:c?.name||p.counterparty||'',wbName:c?.wb_name||null,amount:+p.amount,product:svcOf(p),method:p.source==='shay'?'transfer':(p.method||'transfer'),date:p.paid_at}},'*');
    else toast('התוסף לא מותקן בכרום — בן ארי ייפתח ריק');
    window.open('https://wbfbamldcpa.azurewebsites.net/','webenefit');
    await db(SB.from('payments').update({invoice_status:'queued'}).eq('id',id));reload()},
  bill:id=>{const t=billText(id);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('ההודעה הועתקה — מדביקים בוואטסאפ'),()=>dlg(`<h2>הודעת חיוב</h2><textarea class="f" rows="10">${esc(t)}</textarea>`))},
  expCsv:()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const L=S.expenses.filter(x=>exAll||mKey(x.spent_at)===period).sort((a,b)=>a.spent_at<b.spent_at?-1:1);
    const rows=[['תאריך','ספק','קטגוריה','מקור','סכום','חשבונית','הערה'],...L.map(x=>[x.spent_at,x.vendor,x.category,x.method,x.amount,({missing:'חסרה',received:'התקבלה',na:'לא נדרש'})[x.invoice]||'',x.notes])];
    const blob=new Blob(['\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='הוצאות-'+(exAll?'הכל':period)+'.csv';a.click()},
  newExp:()=>expDlg(null),editExp:id=>expDlg(S.expenses.find(x=>x.id===id)),newClient:()=>clientEdit(null),client:id=>clientDlg(cById(id)),
  sess:id=>sessDlg(S.sessions.find(s=>s.id===id)),event:id=>eventDlg(S.events.find(e=>e.event_id===id)),open:id=>openDoc(id),
  sync:async(_,b)=>{b&&(b.disabled=true);const {error}=await SB.functions.invoke('sync-calendar');b&&(b.disabled=false);if(error)return toast('הסנכרון נכשל');toast('היומן סונכרן');reload()},
  newTask:async()=>{const t=$('#tT').value.trim();if(!t)return;await db(SB.from('tasks').insert({title:t,due:$('#tD').value||null}),'נוסף');reload()},
  sent:async()=>{const ids=S.docs.filter(d=>d.month===period).map(d=>d.id);if(!ids.length)return toast('אין מסמכים בחודש הזה');await db(SB.from('docs').update({sent_to_accountant:true}).in('id',ids),'סומן');reload()},
  csv:()=>{const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';const rows=[['סוג','תאריך','שם/ספק','סכום','אמצעי/קטגוריה','חשבונית','מספר חשבונית','הערה']];
    S.payments.filter(p=>mKey(p.paid_at)===period).forEach(p=>rows.push(['הכנסה',p.paid_at,cById(p.client_id)?.name,p.amount,METHOD[p.method],INV[p.invoice_status][0],p.invoice_number,p.notes]));
    S.expenses.filter(x=>mKey(x.spent_at)===period).forEach(x=>rows.push(['הוצאה',x.spent_at,x.vendor,x.amount,x.category,x.invoice==='received'?'התקבלה':x.invoice==='na'?'לא נדרש':'חסרה','',x.notes]));
    const blob=new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\n')],{type:'text/csv'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`טל-ליפשטט-${period}.csv`;a.click()}
};

/* ---------- boot ---------- */
function go(){const h=(location.hash||'#cal').slice(1);route=ROUTES.some(r=>r[0]===h)||h==='overview'?h:'cal';$('#msheet').hidden=true;render();window.scrollTo(0,0)}
$('#mMenu').onclick=()=>$('#msheet').hidden=false;$('#mClose').onclick=()=>$('#msheet').hidden=true;$('#msheet').onclick=e=>{if(e.target.id==='msheet')$('#msheet').hidden=true};
$('#fileIn').onchange=e=>{upload([...e.target.files]);e.target.value=''};
$('#syncBtn').onclick=e=>ACT.sync(null,e.target);
$('#outBtn').onclick=async()=>{await SB.auth.signOut();location.reload()};
async function enter(){
  try{await load()}catch(e){$('#gate').hidden=false;$('#gErr').textContent='אין הרשאה';return}
  if(!S.clients.length){const {data}=await SB.rpc('is_owner');if(!data){$('#gate').hidden=false;$('#gErr').textContent='המשתמש הזה לא מורשה';return}}
  $('#gate').hidden=true;window.onhashchange=go;go();
}
$('#gForm').onsubmit=async e=>{e.preventDefault();$('#gErr').textContent='';const {error}=await SB.auth.signInWithPassword({email:$('#gEm').value.trim(),password:$('#gPw').value});if(error)return $('#gErr').textContent=error.message==='Invalid login credentials'?'מייל או סיסמה שגויים':error.message;enter()};
$('#gNew').onclick=async()=>{const email=$('#gEm').value.trim(),password=$('#gPw').value;if(password.length<6)return $('#gErr').textContent='בחר סיסמה של 6 תווים לפחות';const {data,error}=await SB.auth.signUp({email,password,options:{emailRedirectTo:location.origin+location.pathname}});if(error)return $('#gErr').textContent=error.message;if(data.session)return enter();$('#gErr').textContent='נשלח אליך מייל אישור. לוחצים על הקישור וחוזרים לכאן.'};
$('#gForgot').onclick=async()=>{const email=$('#gEm').value.trim();if(!email)return;await SB.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});$('#gErr').textContent='נשלח מייל לאיפוס סיסמה'};
SB.auth.onAuthStateChange((ev)=>{if(ev==='PASSWORD_RECOVERY'){const p=prompt('סיסמה חדשה:');if(p)SB.auth.updateUser({password:p}).then(()=>toast('הסיסמה עודכנה'))}});
SB.auth.getSession().then(({data})=>{if(data.session)enter();else $('#gate').hidden=false});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
